LABEL vinos
TEXT HELP
Start the vinOS live environment and open the installer.
ENDTEXT
MENU LABEL Install vinOS
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL vinos_nomodeset
TEXT HELP
Same as above with kernel modesetting disabled.
Use this if the screen stays black or the installer never appears.
ENDTEXT
MENU LABEL Install vinOS (safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
