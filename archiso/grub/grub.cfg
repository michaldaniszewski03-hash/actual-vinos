# vinOS live medium, UEFI. Based on archiso's releng grub.cfg.
# %INSTALL_DIR%, %ARCH%, %ARCHISO_UUID%, %KERNEL_PARAMS% are filled in by mkarchiso.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod exfat
insmod udf

set vinos_theme="(${root})/boot/grub/themes/vinos"

insmod all_video
insmod gfxterm
insmod png
set gfxmode="1920x1080,1280x720,auto"
if loadfont "${vinos_theme}/jetbrains-mono-16.pf2" ; then
    loadfont "${vinos_theme}/jetbrains-mono-22.pf2"
    loadfont "${vinos_theme}/jetbrains-mono-bold-22.pf2"
    terminal_input console
    terminal_output gfxterm
    set theme="${vinos_theme}/theme.txt"
fi

insmod serial
insmod usbserial_common
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == 'i386' ]; then
        uefi_machine_type_lower='ia32'
    fi
fi

default=vinos
timeout=10
timeout_style=menu

menuentry "Install vinOS" --class vinos --class gnu-linux --class os --id 'vinos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Install vinOS (safe graphics)" --class vinos --class gnu-linux --class os --id 'vinos-nomodeset' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' -a -f "/boot/memtest86+/memtest86${uefi_machine_type_lower}.efi" ]; then
    menuentry 'Memory test' --class memtest {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest86${uefi_machine_type_lower}.efi
    }
fi

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI firmware settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Reboot' --class reboot {
    reboot
}

menuentry 'Power off' --class shutdown {
    halt
}
