# The installed system is a copy of the live root filesystem. The kernel is
# not inside the squashfs (archiso moves /boot onto the ISO), so it's copied
# separately; mkinitcpio regenerates the initramfs later in the sequence.
---
unpack:
    - source: "/run/archiso/bootmnt/vinos/x86_64/airootfs.sfs"
      sourcefs: "squashfs"
      destination: ""
    - source: "/run/archiso/bootmnt/vinos/boot/x86_64/vmlinuz-linux"
      sourcefs: "file"
      destination: "/boot/vmlinuz-linux"
