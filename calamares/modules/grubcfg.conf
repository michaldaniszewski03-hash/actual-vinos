---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet", "loglevel=3" ]
always_use_defaults: true
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "0"
    GRUB_DISABLE_SUBMENU: true
    GRUB_DISABLE_RECOVERY: true
    GRUB_DISABLE_OS_PROBER: false
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_GFXMODE: "1920x1080,1280x720,auto"
    GRUB_GFXPAYLOAD_LINUX: "keep"
    GRUB_THEME: "/usr/share/grub/themes/vinos/theme.txt"
