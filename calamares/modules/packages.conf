# Remove the installer and live-session pieces from the copied system.
---
backend: pacman
skip_if_no_internet: false
update_db: false
update_system: false

pacman:
    num_retries: 2
    disable_download_timeout: false
    needed_only: false

operations:
    - try_remove:
        - calamares
        - cage
        - mkinitcpio-archiso
