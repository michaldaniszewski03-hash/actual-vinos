# "Desktop" page. The choice lands in global storage as
# packagechooser_desktop and is acted on by contextualprocess.conf.
---
mode: required
method: legacy
labels:
    step: "Desktop"
default: hyprland
items:
    - id: hyprland
      name: "Hyprland"
      description: "ilyamiro's serpantinum desktop (Quickshell bar, widgets, theming, SDDM login) on the Hyprland compositor. Downloaded during installation, so it needs an internet connection and adds several minutes."
      screenshot: "/etc/calamares/branding/vinos/desktop/hyprland.png"
    - id: niri
      name: "niri"
      description: "The serpantinum desktop on niri, a scrollable-tiling compositor. Needs an internet connection during installation."
      screenshot: "/etc/calamares/branding/vinos/desktop/niri.png"
    - id: sway
      name: "Sway"
      description: "The serpantinum desktop on Sway, an i3-compatible tiling compositor. Needs an internet connection during installation."
      screenshot: "/etc/calamares/branding/vinos/desktop/sway.png"
    - id: mango
      name: "MangoWC"
      description: "The serpantinum desktop on MangoWC, a lightweight dwl-based compositor. Needs an internet connection during installation."
      screenshot: "/etc/calamares/branding/vinos/desktop/mango.png"
    - id: base
      name: "Base system only"
      description: "No desktop. vinOS boots to a console login and you can install whatever you like afterwards. Works offline."
      screenshot: "/etc/calamares/branding/vinos/desktop/base.png"
