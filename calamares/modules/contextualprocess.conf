# Runs after the bootloader is installed, so a failure here can never leave
# the machine unbootable (vinos-serpantinum also never exits non-zero).
# The live medium's resolv.conf is copied in so the chroot can resolve DNS;
# NetworkManager rewrites it on first boot.
---
dontChroot: true
timeout: 5400
packagechooser_desktop:
    base:
        - "rm -f ${ROOT}/usr/local/bin/vinos-serpantinum"
    hyprland:
        - "cp --remove-destination /etc/resolv.conf ${ROOT}/etc/resolv.conf"
        - command: "chroot ${ROOT} /usr/local/bin/vinos-serpantinum ${USER} hyprland"
          timeout: 5400
    niri:
        - "cp --remove-destination /etc/resolv.conf ${ROOT}/etc/resolv.conf"
        - command: "chroot ${ROOT} /usr/local/bin/vinos-serpantinum ${USER} niri"
          timeout: 5400
    sway:
        - "cp --remove-destination /etc/resolv.conf ${ROOT}/etc/resolv.conf"
        - command: "chroot ${ROOT} /usr/local/bin/vinos-serpantinum ${USER} sway"
          timeout: 5400
    mango:
        - "cp --remove-destination /etc/resolv.conf ${ROOT}/etc/resolv.conf"
        - command: "chroot ${ROOT} /usr/local/bin/vinos-serpantinum ${USER} mango"
          timeout: 5400
