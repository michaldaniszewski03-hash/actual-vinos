# Runs after the bootloader is installed, so a failure here can never leave
# the machine unbootable (vinos-install-desktop also never exits non-zero).
# The live medium's resolv.conf is copied in so the chroot can resolve DNS;
# NetworkManager rewrites it on first boot.
---
dontChroot: true
timeout: 7200
packagechooser_desktop:
    base:
        - "rm -f ${ROOT}/usr/local/bin/vinos-install-desktop"
    hyprland:
        - "cp --remove-destination /etc/resolv.conf ${ROOT}/etc/resolv.conf"
        - command: "chroot ${ROOT} /usr/local/bin/vinos-install-desktop ${USER} hyprland"
          timeout: 7200
    niri:
        - "cp --remove-destination /etc/resolv.conf ${ROOT}/etc/resolv.conf"
        - command: "chroot ${ROOT} /usr/local/bin/vinos-install-desktop ${USER} niri"
          timeout: 7200
    sway:
        - "cp --remove-destination /etc/resolv.conf ${ROOT}/etc/resolv.conf"
        - command: "chroot ${ROOT} /usr/local/bin/vinos-install-desktop ${USER} sway"
          timeout: 7200
    mango:
        - "cp --remove-destination /etc/resolv.conf ${ROOT}/etc/resolv.conf"
        - command: "chroot ${ROOT} /usr/local/bin/vinos-install-desktop ${USER} mango"
          timeout: 7200
    plasma:
        - "cp --remove-destination /etc/resolv.conf ${ROOT}/etc/resolv.conf"
        - command: "chroot ${ROOT} /usr/local/bin/vinos-install-desktop ${USER} plasma"
          timeout: 7200
    gnome:
        - "cp --remove-destination /etc/resolv.conf ${ROOT}/etc/resolv.conf"
        - command: "chroot ${ROOT} /usr/local/bin/vinos-install-desktop ${USER} gnome"
          timeout: 7200
