# vinOS installer: Calamares top-level settings.
# Installed to /etc/calamares/settings.conf on the live medium.
---
modules-search: [ local ]

instances:
- id:     desktop
  module: packagechooser
  config: packagechooser@desktop.conf

- id:     cleanup
  module: shellprocess
  config: shellprocess@cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - packagechooser@desktop
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - shellprocess@cleanup
  - packages
  - luksbootkeyfile
  - initcpiocfg
  - initcpio
  - users
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - contextualprocess
  - umount
- show:
  - finished

branding: vinos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
